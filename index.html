<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LIXOON - Sistema de Monitoramento de Coleta de Lixo em Tempo Real">
  <meta name="author" content="LIXOON">
  <meta name="google-ucp" content="1">
  <title>LIXOON - Monitoramento de Coleta de Lixo</title>
  
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  
  <!-- Google Consent Mode v2 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      'ad_storage': 'denied',
      'analytics_storage': 'denied',
      'functionality_storage': 'denied',
      'personalization_storage': 'denied',
      'security_storage': 'granted'
    });
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>

  <style>
    :root {
      --primary: #2E8B57;
      --primary-dark: #1f6f47;
      --primary-light: #4caf50;
      --accent: #fff200;
      --background: linear-gradient(135deg, #e8f5e9 0%, #b2dfdb 50%, #e0f2f1 100%);
      --card-bg: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #666;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.16);
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--background);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 2rem 0;
      box-shadow: var(--shadow-md);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    header .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    header h1 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      text-align: center;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    nav a {
      background: var(--accent);
      color: var(--primary);
      padding: 0.75rem 1.5rem;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    nav a:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      background: #fff;
    }

    nav a:active {
      transform: translateY(0);
    }

    /* Main Content */
    main {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 2rem;
    }

    /* Dashboard Grid */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      margin-bottom: 2rem;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .card h2 {
      color: var(--primary);
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: -0.01em;
    }

    /* Caminhões Ativos */
    #caminhoes-ativos {
      font-size: clamp(3rem, 8vw, 4.5rem);
      font-weight: 800;
      color: var(--primary);
      margin: 1rem 0;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Buttons */
    .inc-btn {
      background: var(--accent);
      color: var(--primary);
      border: none;
      border-radius: 12px;
      padding: 0.875rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      margin-top: 1rem;
      font-family: inherit;
    }

    .inc-btn:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .inc-btn:active {
      transform: translateY(0);
    }

    /* Chart Container */
    .chart-container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }

    /* Painel de Descarte */
    .painel-descarte {
      max-width: 1000px;
      margin: 2rem auto;
      grid-column: 1 / -1;
    }

    .painel-descarte h2 {
      text-align: left;
      margin-bottom: 1.5rem;
    }

    /* Formulário */
    .form-descarte {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .form-descarte input,
    .form-descarte select {
      padding: 0.875rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: var(--transition);
      background: white;
    }

    .form-descarte input:focus,
    .form-descarte select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(46, 139, 87, 0.1);
    }

    /* Busca Próxima */
    .busca-proxima {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .busca-proxima input {
      flex: 1;
      min-width: 200px;
      padding: 0.875rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: var(--transition);
    }

    .busca-proxima input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(46, 139, 87, 0.1);
    }

    /* Mapa */
    #mapa-descarte {
      width: 100%;
      height: 450px;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      margin-bottom: 1.5rem;
      background: #f5f5f5;
    }

    /* Lista de Pontos */
    .lista-pontos {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .lista-pontos .ponto {
      padding: 1.25rem;
      border-radius: 12px;
      background: linear-gradient(135deg, #f7f9f8 0%, #ffffff 100%);
      border-left: 4px solid var(--primary);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .lista-pontos .ponto:hover {
      transform: translateX(4px);
      box-shadow: var(--shadow-md);
    }

    .lista-pontos .ponto strong {
      color: var(--primary);
      font-weight: 600;
    }

    /* Footer */
    footer {
      text-align: center;
      color: var(--text-secondary);
      padding: 2rem;
      margin-top: 3rem;
      font-size: 0.9rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      main {
        padding: 0 1rem;
      }

      .dashboard {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .form-descarte {
        grid-template-columns: 1fr;
      }

      .busca-proxima {
        flex-direction: column;
      }

      header .container {
        padding: 0 1rem;
      }
    }

    /* Animações */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      animation: fadeIn 0.6s ease-out;
    }

    .card:nth-child(2) {
      animation-delay: 0.1s;
    }

    .card:nth-child(3) {
      animation-delay: 0.2s;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>🗑️ LIXOON - Monitoramento de Coleta</h1>
      <nav>
        <a href="tcc.html">Painel Completo</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="dashboard">
      <article class="card">
        <h2>Caminhões Ativos</h2>
        <div id="caminhoes-ativos" aria-live="polite">0</div>
        <button class="inc-btn" onclick="incrementarCaminhoesAtivos()" aria-label="Incrementar número de caminhões ativos">
          Incrementar Caminhões
        </button>
      </article>

      <article class="card">
        <h2>Latência API (95º Percentil)</h2>
        <div class="chart-container">
          <canvas id="latencia-api" width="350" height="180" aria-label="Gráfico de latência da API"></canvas>
        </div>
      </article>
    </section>

    <section class="card painel-descarte">
      <h2>Pontos de Descarte de Vidros e Baterias</h2>

      <form id="form-ponto" class="form-descarte" aria-label="Formulário de cadastro de pontos de descarte">
        <input type="text" id="nome-ponto" placeholder="Nome do ponto" required aria-label="Nome do ponto de descarte">
        <select id="tipo-ponto" required aria-label="Tipo de material">
          <option value="Vidro">Vidro</option>
          <option value="Bateria">Bateria</option>
        </select>
        <input type="text" id="endereco-ponto" placeholder="Endereço" required aria-label="Endereço do ponto">
        <input type="text" id="bairro-ponto" placeholder="Bairro" required aria-label="Bairro do ponto">
        <button type="submit" class="inc-btn">Cadastrar</button>
      </form>

      <div class="busca-proxima">
        <input type="text" id="referencia-proxima" placeholder="Digite seu endereço ou referência" aria-label="Buscar ponto mais próximo">
        <button type="button" class="inc-btn" onclick="encontrarMaisProximo()">
          Local mais próximo
        </button>
      </div>

      <div id="mapa-descarte" role="img" aria-label="Mapa de pontos de descarte"></div>

      <div id="lista-pontos" class="lista-pontos" role="list" aria-label="Lista de pontos de descarte cadastrados"></div>
    </section>

    <section class="card" style="max-width: 100%; margin: 2rem auto;">
      <h2>Coletas por Hora</h2>
      <div class="chart-container">
        <canvas id="coletas-por-hora" width="700" height="250" aria-label="Gráfico de coletas por hora"></canvas>
      </div>
    </section>
  </main>

  <footer>
    <p>LIXOON &copy; 2026 &mdash; Dashboard Moderno</p>
  </footer>

  <!-- Scripts -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="apiService.js"></script>
  <script src="tcc.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('service-worker.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
